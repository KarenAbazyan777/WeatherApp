<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset="0.45" stop-color="#8fc3f0"/>
      <stop offset="0.75" stop-color="#d9ecfb"/>
      <stop offset="1" stop-color="#fde7c8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#fff1b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe7a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db8dc"/>
      <stop offset="1" stop-color="#c3d6ee"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8fc4"/>
      <stop offset="1" stop-color="#8eaad6"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5d99"/>
      <stop offset="1" stop-color="#2c4475"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1480" cy="260" r="260" fill="url(#sunGlow)"/>
  <circle cx="1480" cy="260" r="70" fill="#fffdf2"/>

  <!-- clouds -->
  <g fill="#ffffff" filter="url(#soft)">
    <g opacity="0.85">
      <ellipse cx="300" cy="200" rx="170" ry="45"/>
      <ellipse cx="380" cy="170" rx="110" ry="55"/>
      <ellipse cx="240" cy="180" rx="80" ry="40"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1000" cy="130" rx="200" ry="40"/>
      <ellipse cx="1080" cy="105" rx="120" ry="50"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="1700" cy="420" rx="180" ry="38"/>
      <ellipse cx="1770" cy="395" rx="100" ry="45"/>
    </g>
    <g opacity="0.6">
      <ellipse cx="650" cy="380" rx="150" ry="30"/>
      <ellipse cx="700" cy="360" rx="90" ry="35"/>
    </g>
  </g>

  <!-- far mountains: twin snowy peaks -->
  <path fill="url(#far)" d="M0 760 L260 690 L520 720 L760 560 L900 470 L1010 560 L1080 610 L1190 540 L1290 600 L1500 650 L1720 610 L1920 660 L1920 1080 L0 1080 Z"/>
  <path fill="#f4f8fd" d="M900 470 L960 520 L935 530 L912 515 L885 535 L860 512 Z"/>
  <path fill="#f4f8fd" d="M1190 540 L1225 562 L1205 570 L1188 560 L1168 570 L1160 560 Z"/>

  <!-- middle hills -->
  <path fill="url(#mid)" d="M0 820 C200 760 380 800 560 770 C760 735 900 800 1100 780 C1300 760 1460 720 1650 760 C1780 785 1860 770 1920 760 L1920 1080 L0 1080 Z"/>

  <!-- near hills -->
  <path fill="url(#near)" d="M0 920 C220 870 420 900 640 880 C880 858 1040 920 1280 900 C1500 882 1700 860 1920 890 L1920 1080 L0 1080 Z"/>
</svg>
